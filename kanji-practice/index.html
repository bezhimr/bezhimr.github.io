<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="icon/favicon.ico">
<title>Renshūchō</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/brush.css">
</head>
<body>

<main>
  <div class="controls">

    <section class="panel">
      <div class="views" id="views" role="tablist">
        <button class="view" role="tab" data-view="chars">Characters <small id="count"></small></button>
        <button class="view" role="tab" data-view="settings">Settings</button>
      </div>
      <div class="selbar">
        <p class="status" id="status" aria-live="polite"></p>
        <button class="link" id="clear">Clear all</button>
      </div>

      <div id="view-chars" role="tabpanel">
        <div class="tabs" id="tabs"></div>
        <div id="picker"></div>
      </div>

      <div id="view-settings" role="tabpanel" hidden>
        <div class="row">
          <label for="s-trace">Tracing boxes</label>
          <input type="number" id="s-trace" data-k="trace" min="0" max="20">
        </div>
        <div class="row">
          <label for="s-guide">Crossed boxes</label>
          <input type="number" id="s-guide" data-k="guide" min="0" max="20">
        </div>
        <div class="row">
          <label for="s-blank">Empty boxes</label>
          <input type="number" id="s-blank" data-k="blank" min="0" max="20">
        </div>
        <div class="row">
          <label for="s-box">Box size, mm</label>
          <input type="number" id="s-box" data-k="box" min="1">
          <div class="hint" id="perline"></div>
        </div>
        <div class="row" hidden>
          <label for="s-pen">Model and tracing</label>
          <select id="s-pen" data-k="pen">
            <option value="brush">Brush pen (Klee One)</option>
            <option value="liner">Liner (thin stroke lines)</option>
          </select>
        </div>
        <div class="row" id="row-linewidth">
          <label for="s-linewidth">Line width</label>
          <span class="range">
            <input type="range" id="s-linewidth" data-k="lineWidth" min="0.2" max="1.5" step="0.1">
            <output for="s-linewidth" id="linewidth-value"></output>
          </span>
        </div>
        <div class="row">
          <label for="s-order">Stroke order</label>
          <select id="s-order" data-k="order">
            <option value="box">In its own box</option>
            <option value="model">On the model</option>
            <option value="off">Off</option>
          </select>
        </div>
        <div class="row">
          <label for="s-opacity">Gray glyph strength</label>
          <span class="range">
            <input type="range" id="s-opacity" data-k="opacity" min="5" max="60">
            <output for="s-opacity" id="opacity-value"></output>
          </span>
        </div>

        <div class="checks">
          <label id="row-model"><input type="checkbox" data-k="model"> Model box</label>
          <label><input type="checkbox" data-k="gray"> Gray tracing glyphs</label>
          <label><input type="checkbox" data-k="guidesAll"> Cross guides in model and tracing boxes</label>
          <label><input type="checkbox" data-k="info"> Readings and meanings</label>
          <label id="row-strokecount"><input type="checkbox" data-k="strokeCount"> Stroke count in the caption</label>
          <label><input type="checkbox" data-k="credit"> Credits line on every page</label>
          <label><input type="checkbox" data-k="spread"> Spread characters down the whole page</label>
        </div>
      </div>
    </section>

    <section class="panel credits">
      <h2>Sources and credits</h2>
      <p id="usage"></p>
      <p id="inspired-by"></p>

      <details class="license">
        <summary id="details-summary"></summary>
        <dl id="sources"></dl>
        <p id="sources-note"></p>
      </details>
    </section>

  </div>

  <div class="previewcol">
    <div class="preview"><div class="pages" id="sheet"></div></div>
    <div class="pages" id="printout" aria-hidden="true"></div>
    <nav class="rail" aria-label="Sheet">
      <button class="rbtn primary" id="generate" title="Lay out the selected characters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        <span>Generate</span>
      </button>
      <button class="rbtn" id="print" title="Print the sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
        <span>Print</span>
      </button>
      <button class="rbtn" id="download" title="Save the sheet as a file that prints anywhere, no internet or fonts needed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        <span>Save</span>
      </button>
    </nav>
  </div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
